  description: >-
    Public reproducibility-core release prepared for journal submission. It contains
    HCC analysis protocols, derived matrices, locked result tables, figure source data,
    executable scripts and environment specifications. Primary GEO, TCGA and ICGC files are not redistributed; their
    accession identifiers, download locations, versions and checksums are recorded
    in the included manifests.
