metadata:
  title: "Paired cross-platform transcriptomic analysis with dual-cohort validation identifies recurrent tissue-level alterations in hepatocellular carcinoma: research compendium"
  upload_type: software
  publication_date: "2026-11-22"
  version: "v0.2.0-submission"
  description: >-
    Public reproducibility-core release prepared for journal submission. It contains
    HCC analysis protocols, derived matrices, locked result tables, explicit identifier
    and denominator audits, donor-level sensitivity outputs, figure source data,
    executable scripts and environment specifications. Primary GEO, TCGA and ICGC files are not redistributed; their
    accession identifiers, download locations, versions and checksums are recorded
    in the included manifests.
